<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff6b6b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="带娃工作台" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <title>带娃工作台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部 Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="title">🏠 带娃工作台</h1>
        <div class="subtitle" id="js-subtitle">12-14 月龄 · 第 1 周</div>
      </div>
      <button class="btn-icon" id="js-reset-btn" title="重置全部数据">↺</button>
    </header>

    <!-- 主内容区 -->
    <main class="main" id="js-main">
      <!-- 内容由 app.js 动态渲染 -->
      <div class="loading">加载中...</div>
    </main>

    <!-- 底部 Tab 栏 -->
    <nav class="tabbar">
      <button class="tab active" data-tab="home">🏠</button>
      <button class="tab" data-tab="today">📋</button>
      <button class="tab" data-tab="theme">🎨</button>
      <button class="tab" data-tab="library">📚</button>
      <button class="tab" data-tab="milestone">📈</button>
      <button class="tab" data-tab="principle">💡</button>
      <button class="tab" data-tab="toys">🧸</button>
      <button class="tab" data-tab="english">🔤</button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
